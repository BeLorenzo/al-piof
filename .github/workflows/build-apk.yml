name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compila Al piöf APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installa Dipendenze NPM
        run: npm ci

      - name: Build Web App (Vite)
        run: npm run build

      - name: Aggiungi o Sincronizza Piattaforma Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Compila APK Debug con Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Carica APK pronto per il download
        uses: actions/upload-artifact@v4
        with:
          name: AlPiof-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error